include:
  - ./kong/docker-compose.yml
  - ./elk/docker-compose.yml
  - ./monitoring/docker-compose.yml

volumes:
  data:
  prometheus-data:
  grafana_data:

services:
  hw-storage:
    image: minio/minio:latest
    command: server /data
    restart: always
    expose: 
      - 9000
    networks:
      - kong-net
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-STORAGE_SECRET_KEY}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  hw-createbuckets:
    image: minio/mc
    depends_on:
      - hw-storage
    restart: on-failure
    networks:
      - kong-net
    entrypoint: > 
      /bin/sh -c "      
      /usr/bin/mc alias set storage http://hw-storage:9000 ${Storage_AccessKey-STORAGE_ACCESS_KEY} ${Storage_Secret-STORAGE_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing storage/${Storage_Bucket:-data} &&
      /usr/bin/mc anonymous set download storage/${Storage_Bucket:-data} &&
      exit 0;
      "

  hw-uploader:
    build: ./uploader
    depends_on:
      - hw-storage
      - hw-createbuckets
    expose: 
      - 3000
    networks:
      - kong-net
    environment:
      PORT: 3000
      S3_HOST: hw-storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      S3_ACCESS_SECRET: ${Storage_Secret:-STORAGE_SECRET_KEY}
      S3_BUCKET: ${Storage_Bucket:-STORAGE_BUCKET}
  
  hw-security:
    build: ./security
    expose: 
      - 3000
    ports:
      - 3000:3000
    networks:
      - kong-net
    environment:
      PORT: 3000
      
networks:
  kong-net:
    external: false

