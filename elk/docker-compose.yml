services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: master-01\n"\
          "    dns:\n"\
          "      - master-01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - 192.168.1.202\n"\
          "  - name: master-02\n"\
          "    dns:\n"\
          "      - master-02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - 192.168.1.202\n"\
          "  - name: data-master-hot\n"\
          "    dns:\n"\
          "      - data-master-hot\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - 192.168.1.202\n"\
          "  - name: data-warm\n"\
          "    dns:\n"\
          "      - data-warm\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 755 \{\} \;;
        find . -type f -exec chmod 644 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://master-01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://master-01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/master-01/master-01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  master-01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - masterdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    networks:
      - kong-net
    environment:
      - node.name=master-01
      - node.roles=master
      - network.host=0.0.0.0
      - http.publish_host=master-01
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=master-01,master-02,data-master-hot
      - discovery.seed_hosts=master-02,data-master-hot
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - http.cors.enabled=true
      - http.cors.allow-origin=/.*/
      - http.cors.allow-methods=OPTIONS,HEAD,GET,POST,PUT,DELETE
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/master-01/master-01.key
      - xpack.security.http.ssl.certificate=certs/master-01/master-01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/master-01/master-01.key
      - xpack.security.transport.ssl.certificate=certs/master-01/master-01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  master-02:
    depends_on:
      - master-01
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - masterdata02:/usr/share/elasticsearch/data
    networks:
      - kong-net
    environment:
      - node.name=master-02
      - node.roles=master
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=master-01,master-02,data-master-hot
      - discovery.seed_hosts=master-01,data-master-hot
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - http.cors.enabled=true
      - http.cors.allow-origin=/.*/
      - http.cors.allow-methods=OPTIONS,HEAD,GET,POST,PUT,DELETE
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/master-02/master-02.key
      - xpack.security.http.ssl.certificate=certs/master-02/master-02.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/master-02/master-02.key
      - xpack.security.transport.ssl.certificate=certs/master-02/master-02.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  data-master-hot:
    depends_on:
      - master-01
      - master-02
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - datahot:/usr/share/elasticsearch/data
    networks:
      - kong-net
    environment:
      - node.name=data-master-hot
      - node.roles=master,data_content,data_hot,voting_only
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=master-01,master-02
      - discovery.seed_hosts=master-01,master-02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/data-master-hot/data-master-hot.key
      - xpack.security.http.ssl.certificate=certs/data-master-hot/data-master-hot.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/data-master-hot/data-master-hot.key
      - xpack.security.transport.ssl.certificate=certs/data-master-hot/data-master-hot.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  data-warm:
    depends_on:
      - master-01
      - master-02
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - datawarm:/usr/share/elasticsearch/data
    networks:
      - kong-net
    environment:
      - node.name=data-warm
      - node.roles=data_warm
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=master-01,master-02
      - discovery.seed_hosts=master-01,master-02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/data-warm/data-warm.key
      - xpack.security.http.ssl.certificate=certs/data-warm/data-warm.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/data-warm/data-warm.key
      - xpack.security.transport.ssl.certificate=certs/data-warm/data-warm.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      master-01:
        condition: service_healthy
      master-02:
        condition: service_healthy
      kibana-init:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    networks:
      - kong-net
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=["https://master-01:9200","https://master-02:9200"]
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - MONITORING_UI_CCS_ENABLED=false
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120


  kibana-init:
    image: curlimages/curl:latest
    depends_on:
      master-01:
        condition: service_healthy
    networks:
      - kong-net
    volumes:
      - certs:/certs:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}
      KIBANA_ADMIN_PASSWORD: ${KIBANA_ADMIN_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Elasticsearch..."

        until curl -s \
          --cacert /certs/ca/ca.crt \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          https://master-01:9200 >/dev/null
        do
          sleep 5
        done

        echo "Elasticsearch is ready"

        echo "Setting kibana_system password..."

        curl --fail \
          --cacert /certs/ca/ca.crt \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -X PUT \
          https://master-01:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"

        echo "Creating admin user..."

        curl --fail \
          --cacert /certs/ca/ca.crt \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -X POST \
          https://master-01:9200/_security/user/admin \
          -H 'Content-Type: application/json' \
          -d "{
            \"password\": \"$${KIBANA_ADMIN_PASSWORD}\",
             \"roles\": [
                \"kibana_admin\",
                \"superuser\",
                \"monitoring_user\"
                ],
            \"full_name\": \"Kibana Administrator\"
          }"

        echo "Kibana users configured"
    restart: "no"

  elcuve:
    depends_on:
      master-01:
        condition: service_healthy
      master-02:
        condition: service_healthy
    image: cars10/elasticvue
    volumes:
      - certs:/usr/share/elcuve/config/certs
    ports:
      - 8080:8080
    networks:
      - kong-net
    environment:
      ELASTICVUE_CLUSTERS: '[{"name":"es-hw-cluster","uri":"https://192.168.1.202:9200","username":"elastic","password":"1q2w3e4r"}]'
    mem_limit: ${MEM_LIMIT}
  
  vector-agent:
    depends_on:
      master-01:
        condition: service_healthy
    image: timberio/vector:0.57.0-debian
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - certs:/etc/vector/certs:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    networks:
      - kong-net

    
volumes:
  certs:
    driver: local
  masterdata01:
    driver: local
  masterdata02:
    driver: local
  datahot:
    driver: local
  datawarm:
    driver: local
  kibanadata:
    driver: local

networks:
  kong-net:
    external: false
    